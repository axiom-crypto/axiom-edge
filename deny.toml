# cargo-deny configuration for axiom-edge.
#
# Schema reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Goal: a working release gate, not a perpetually-red CI job. We curate the
# license allow-list to what the current tree actually pulls in, allow the
# small set of git sources the project pins on purpose (openvm, stark-backend),
# and document the unfixable transitive advisories with dated rationale.
#
# NOTE: `all-features = false`, so the `evm-prove` dependency graph (halo2,
# halo2-lib, snark-verifier — all git-pinned) is NOT covered by these checks.
# Enabling it would require extending `allow-git` and the license allow-list.

[graph]
all-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# Advisories — surface RUSTSEC entries; document the two we can't push a fix
# for upstream. Review on every bump of openvm / stark-backend.
# -----------------------------------------------------------------------------
[advisories]
version = 2
yanked = "warn"
# Each ignore is a transitive dep we can't push a fix for from this repo. The
# direct chain runs through the openvm / stark-backend / halo2 graph; re-review
# on every bump of those pins and after 2027-03-01. Last reviewed 2026-09-02
# against openvm v2.1.0-rc.0 (RUSTSEC-2026-0097 dropped: no longer matches).
ignore = [
    # bincode 1.x — workspace pins for backwards-compatible wire format.
    # Migration to 2.x ripples through proof/protocol and openvm-stark-sdk.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained; migration tracked as follow-up" },
    # ansi_term, derivative, generational-arena, paste — all transitive via the
    # halo2 / openvm graph; replacing them is upstream's call.
    { id = "RUSTSEC-2021-0139", reason = "ansi_term unmaintained; transitive via halo2" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained; transitive via halo2/openvm" },
    { id = "RUSTSEC-2024-0014", reason = "generational-arena unmaintained; transitive via openvm" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via openvm/p3" },
    # proc-macro-error2 — build-time proc-macro dep of getset, pulled in by the
    # openvm v2.0.0-rc.2 circuit crates. Upstream-unmaintained, no safe upgrade;
    # build-only (not in any shipped artifact).
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; build-time, transitive via getset -> openvm rc.2" },
]

# -----------------------------------------------------------------------------
# Licenses — list everything actually present in `cargo metadata` today.
# `clarify` entries cover git deps that omit Cargo.toml's `license` field but
# ship a LICENSE file in their repo (all MIT per upstream).
# -----------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Zlib",
]

# Workspace path crates (publish = false) — allow them unconditionally.
[licenses.private]
ignore = true

# Git deps without a Cargo.toml `license` field. Upstream LICENSE files are MIT
# (openvm-org/openvm, openvm-org/stark-backend) or MIT (poseidon2, halo2). We
# do not hash-pin the LICENSE blobs here because the git revs are pinned and
# the LICENSE file at those revs has been inspected by hand; revisit at bump.
[[licenses.clarify]]
crate = "openvm-circuit"
expression = "MIT"
license-files = []
