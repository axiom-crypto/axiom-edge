# -----------------------------------------------------------------------------
# Bans — no policy yet. Section kept minimal; revisit when graph stabilises.
# -----------------------------------------------------------------------------
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

# -----------------------------------------------------------------------------
# Sources — restrict to crates.io and the git sources we pin on purpose.
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/openvm-org/openvm.git",
    "https://github.com/openvm-org/stark-backend.git",
]
