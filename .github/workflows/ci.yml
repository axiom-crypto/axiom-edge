name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - mock-provers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.features }}
      - name: cargo clippy
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets --features ${{ matrix.features }} -- -D warnings
          fi

  # Enforce the declared MSRV (Cargo.toml rust-version / rust-toolchain.toml).
  # The fmt/clippy/test jobs run on @stable, which bypasses the pin, so without
  # this job an accidental use of a >1.91.1 feature would pass CI yet break any
  # consumer on the MSRV. Compile-only check on the exact pinned toolchain.
  msrv:
    name: cargo check (MSRV 1.91.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --workspace --all-targets

  # The `mock-provers` matrix entry compiles and runs `mock_e2e_test.rs`
  # in crates/edge-integration-tests, the self-contained mock E2E that boots
  # one manager + one worker in-process on kernel-assigned ports and exercises
  # the full register → dispatch → app/leaf/internal → Completed control loop.
  # No GPU, no real artifacts, no subprocesses — this is the runnable subset.
  #
  # NOT covered here: tests/deferral_stark_e2e_test.rs (gated on the
  # `real-deferral-integration` feature) — it runs a real prover and needs
  # locally derived fixtures; see docs/DEFERRAL.md.
  test:
    name: cargo test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - mock-provers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.features }}
      - name: cargo test
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test --workspace
          else
            cargo test --workspace --features ${{ matrix.features }}
          fi

  # Compile-only coverage for the production feature set
  # (config/defaults.toml: features = "cuda,jemalloc,parallel,aot,unprotected").
  # The default/mock-provers jobs above never type-check these paths, so prod
  # code can rot silently. These jobs build but do not run (no GPU needed).
  #
  # Toolchain is 1.91.1 (rust-toolchain.toml). The openvm git deps require
  # rustc >= 1.91.1, so an older toolchain fails to resolve; `unprotected`
  # compiles fine on stable despite its historical "requires nightly" note.
  prod-features-cpu:
    name: check prod CPU features (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: prod-features-cpu
      - name: cargo check (jemalloc, parallel, aot, unprotected)
        run: cargo check -p edge-worker --features jemalloc,parallel,aot,unprotected
      # `evm-prove` gates a large body of code the default/mock-provers jobs
      # never compile: the real Halo2Prover/RootProver, `run_evm_prove`, and the
      # `halo2-keygen` bin (whose `main` is evm-prove-only). Compile it here so
      # the EVM path can't rot silently. CPU-only — halo2 needs no GPU.
      - name: cargo check (+ evm-prove)
        run: cargo check -p edge-worker --features jemalloc,parallel,aot,unprotected,evm-prove

  # License + advisory + source gate. Configuration lives in deny.toml at the
  # repo root; see the file header for the license curation rationale and the
  # documented advisory ignores.
  #
  # NOTE: we run cargo-deny directly on the runner rather than via
  # EmbarkStudios/cargo-deny-action. That action executes inside its own
  # container shipping a fixed Rust (musl) toolchain; cargo-deny shells out to
  # `cargo metadata`, which honors this repo's rust-toolchain.toml pin (1.91.1)
  # and then fails with "override toolchain '1.91.1' is not installed" because
  # the container only has its bundled toolchain. Installing the pinned
  # toolchain here and using a prebuilt cargo-deny binary avoids that mismatch
  # and matches the MSRV used by the rest of CI.
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  prod-features-cuda:
    name: check prod CUDA path (compile-only)
    runs-on: ubuntu-latest
    # CUDA *devel* image ships nvcc + headers — required because
    # openvm-cuda-builder hard-fails (exit 1) when `nvcc --version` is absent,
    # and its build script compiles vpmm_shim.cu. No GPU is present or needed.
    # Tag tracks production's CUDA toolkit (config/defaults.toml + docker/Dockerfile,
    # currently 13.1); keep it in sync so this compile gate catches CUDA-version
    # rot that would only surface in the real production build. Note sm_120
    # requires CUDA >= 12.8, so this gate cannot run on the old 12.6 image.
    container:
      image: nvidia/cuda:13.1.0-devel-ubuntu24.04
    env:
      # No GPU on the runner: pin concrete arch(s) so openvm-cuda-builder skips
      # its nvidia-smi autodetection, which would otherwise panic. Compile every
      # arch we deploy to so the gate catches arch-specific codegen rot: 89 =
      # Ada (L40S), 120 = Blackwell. Keep this list in sync with the arch(s)
      # produced for production (config/defaults.toml cuda_arch).
      CUDA_ARCH: "89,120"
    steps:
      - uses: actions/checkout@v4
      # The container is bare (no rustup/git/cc). checkout falls back to the
      # REST API without git; install everything cargo needs before building.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.91.1 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: prod-features-cuda
      - name: cargo check (full production feature set)
        run: cargo check -p edge-worker --features cuda,jemalloc,parallel,aot,unprotected
